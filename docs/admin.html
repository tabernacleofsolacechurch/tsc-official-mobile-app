<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B2A4A">
<title>TSC Admin</title>
<style>
:root{--navy:#1B2A4A;--navy2:#24365c;--gold:#D4AF37;--ala:#F7F9FA}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:var(--ala);font:16px/1.6 system-ui,sans-serif;padding-bottom:40px}
header{padding:16px;text-align:center}
header img{height:70px;background:#fff;padding:5px;border-radius:12px}
header h1{color:var(--gold);font-size:18px;margin-top:6px}
main{padding:10px 16px;max-width:680px;margin:auto}
.card{background:var(--navy2);border:1px solid #3a4d78;border-radius:14px;padding:16px;margin-bottom:14px}
.card h2,.card h3{color:var(--gold);margin-bottom:6px}
.muted{opacity:.75;font-size:14px}
.btn{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;border:0;border-radius:10px;padding:9px 14px;margin:6px 8px 0 0;text-decoration:none;font-size:14px}
.btn.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.fl{display:block;margin:12px 0 4px;font-size:14px}
.in{width:100%;padding:11px;border-radius:10px;border:1px solid #3a4d78;background:#12203b;color:var(--ala);font:inherit;margin-bottom:10px}
.err{color:#ff9a9a;margin:10px 0}
.nm{font-size:18px;font-weight:700;color:var(--gold)}
</style></head>
<body>
<header><img src="tsc-logo.png" alt="TSC"><h1>Staff Dashboard</h1></header>
<main id="app"></main>
<script>
var BASE='https://kniksxocjsuqghydipmg.supabase.co';
var KEY='sb_publishable_d_CZpD5xT8TPeg10c07Jog_QoqJ_qan';
var app=document.getElementById('app');
var S=null,ME=null,D={},cur='prayer_requests',flt='all';
try{S=JSON.parse(sessionStorage.getItem('tscs')||'null');}catch(e){}
function save(){if(S)sessionStorage.setItem('tscs',JSON.stringify(S));else sessionStorage.removeItem('tscs');}
function h(t,a){var e=document.createElement(t);a=a||{};for(var k in a){if(k==='class')e.className=a[k];else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}
for(var i=2;i<arguments.length;i++){[].concat(arguments[i]).forEach(function(c){if(c==null||c===false||c==='')return;e.append(c.nodeType?c:document.createTextNode(String(c)));});}return e;}
function authCall(path,body){return fetch(BASE+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Sign in failed');return j;});});}
function refresh(){return authCall('token?grant_type=refresh_token',{refresh_token:S.refresh_token}).then(function(j){S=j;save();}).catch(function(){S=null;save();showLogin('Session expired. Please sign in again.');throw new Error('Session expired.');});}
function rest(path,opt,retry){opt=opt||{};var hd={apikey:KEY,Authorization:'Bearer '+S.access_token};for(var k in (opt.headers||{}))hd[k]=opt.headers[k];if(opt.body)hd['Content-Type']='application/json';
return fetch(BASE+'/rest/v1/'+path,{method:opt.method||'GET',headers:hd,body:opt.body}).then(function(r){
if(r.status===401&&!retry){return refresh().then(function(){return rest(path,opt,true);});}
if(!r.ok)return r.text().then(function(t){var m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);});
return r.text().then(function(t){return t?JSON.parse(t):null;});});}
function showLogin(msg){
var em=h('input',{type:'email',class:'in',value:'tabernacleofsolacechurch@gmail.com',autocomplete:'username'});
var pw=h('input',{type:'password',class:'in',autocomplete:'current-password'});
var err=h('p',{class:'err'},msg||'');
var b=h('button',{class:'btn',type:'button'},'Sign in');
b.addEventListener('click',function(){err.textContent='';b.disabled=true;b.textContent='Signing in...';
authCall('token?grant_type=password',{email:em.value.trim(),password:pw.value}).then(function(j){S=j;save();boot();}).catch(function(e){b.disabled=false;b.textContent='Sign in';err.textContent=e.message;});});
app.replaceChildren(h('div',{class:'card'},h('h2',{},'Staff sign in'),h('label',{class:'fl'},'Email',em),h('label',{class:'fl'},'Password',pw),err,b));}
function boot(){
if(!S){showLogin();return;}
app.replaceChildren(h('p',{class:'muted'},'Loading...'));
rest('profiles?select=roles,active&id=eq.'+S.user.id).then(function(p){p=p&&p[0];
if(!p||!p.active||!p.roles||!p.roles.length){S=null;save();showLogin('This account does not have dashboard access.');return;}
ME=p;loadAll();}).catch(function(e){S=null;save();showLogin(e.message);});}
var T=[['prayer_requests','Prayer'],['members','Members'],['new_believer_requests','New believers']];
var ST={prayer_requests:['new','received','assigned','followed_up','closed'],members:['new_registration','contacted','active'],new_believer_requests:['new','contacted','followed_up','closed']};
function isNew(r){return r.status==='new'||r.status==='new_registration';}
function loadAll(){Promise.all(T.map(function(t){return rest(t[0]+'?select=*&order=created_at.desc&limit=300').then(function(r){D[t[0]]=r||[];D[t[0]+'_err']='';}).catch(function(e){D[t[0]]=[];D[t[0]+'_err']=e.message;});})).then(render);}
var tabsEl=h('div',{}),listEl=h('div',{});
function out(){S=null;save();showLogin();}
function render(){app.replaceChildren(
h('div',{class:'card'},h('p',{class:'muted'},'Signed in as '+S.user.email+' ('+ME.roles.join(', ')+')'),h('button',{class:'btn alt',onclick:out},'Sign out'),h('button',{class:'btn alt',onclick:loadAll},'Refresh')),tabsEl,listEl);drawTabs();drawList();}
function drawTabs(){tabsEl.replaceChildren(h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px'},T.map(function(t){var n=(D[t[0]]||[]).filter(isNew).length;return h('button',{class:'btn'+(t[0]===cur?'':' alt'),onclick:function(){cur=t[0];flt='all';drawTabs();drawList();}},t[1]+(n?' ('+n+' new)':''));})));}
function drawList(){var rows=D[cur]||[];var all=ST[cur].slice();rows.forEach(function(r){if(r.status&&all.indexOf(r.status)<0)all.push(r.status);});
var f=h('select',{class:'in'},[h('option',{value:'all'},'All statuses')].concat(all.map(function(s){return h('option',{value:s},s.replace(/_/g,' '));})));
f.value=flt;f.addEventListener('change',function(){flt=f.value;drawList();});
var shown=rows.filter(function(r){return flt==='all'||r.status===flt;});
listEl.replaceChildren(f,D[cur+'_err']&&h('p',{class:'err'},D[cur+'_err']),shown.length?shown.map(function(r){return card(cur,r,all);}):h('p',{class:'muted'},'Nothing here yet.'));}
function pr(l,v){if(Array.isArray(v))v=v.join(', ');return v?h('p',{},h('span',{class:'muted'},l+': '),String(v)):null;}
function waNum(p){var d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.charAt(0)==='0')d='234'+d.slice(1);return d;}
function patch(tb,id,o){return rest(tb+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(o)}).then(function(res){if(!res||!res.length)throw new Error('You do not have permission to change this.');});}
function card(tb,r,opts){
var nk=('internal_notes' in r)?'internal_notes':(('notes' in r)?'notes':null);
var name=r.full_name||r.name||'(no name)';
var raw=r.phone||r.contact_detail||'';var isE=String(raw).indexOf('@')>-1;
var em=r.email||(isE?raw:'');var n=waNum(isE?(r.phone||''):raw);
var body=[];
if(tb==='prayer_requests'){body=[pr('Request',r.request),pr('Contact',[r.contact_method,r.contact_detail].filter(Boolean).join(' - ')),pr('May contact',r.may_contact===true?'Yes':(r.may_contact===false?'No':''))];}
else if(tb==='members'){body=[pr('Phone',r.phone),pr('Email',r.email),pr('Area',r.area),pr('Faith',r.faith_status),pr('Departments',r.interest_departments||r.department),pr('Preferred contact',r.preferred_contact),pr('Message',r.message)];}
else{body=[pr('Phone',r.phone),pr('Email',r.email),pr('Preferred contact',r.preferred_contact),pr('Needs',r.request_types),pr('Message',r.message)];}
var sel=h('select',{class:'in'},opts.map(function(s){var o=h('option',{value:s},s.replace(/_/g,' '));if(s===r.status)o.selected=true;return o;}));
var msg=h('span',{class:'muted'},'');
sel.addEventListener('change',function(){msg.textContent='Saving...';patch(tb,r.id,{status:sel.value}).then(function(){r.status=sel.value;msg.textContent='Saved';drawTabs();}).catch(function(e){msg.textContent='Could not save: '+e.message;sel.value=r.status;});});
var nt=null,nb=null,nm=h('span',{class:'muted'},'');
if(nk){nt=h('textarea',{class:'in',rows:'2',placeholder:'Private staff notes'});nt.value=r[nk]||'';
nb=h('button',{class:'btn alt',type:'button'},'Save notes');
nb.addEventListener('click',function(){var o={};o[nk]=nt.value;nm.textContent='Saving...';patch(tb,r.id,o).then(function(){r[nk]=nt.value;nm.textContent='Saved';}).catch(function(e){nm.textContent='Could not save: '+e.message;});});}
return h('div',{class:'card'},
h('p',{class:'nm'},name),
h('p',{class:'muted'},r.created_at?new Date(r.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):''),
body,
h('div',{},n&&h('a',{class:'btn',href:'https://wa.me/'+n,target:'_blank',rel:'noopener'},'WhatsApp'),n&&h('a',{class:'btn alt',href:'tel:+'+n},'Call'),em&&h('a',{class:'btn alt',href:'mailto:'+em},'Email')),
h('label',{class:'fl'},'Status',sel),msg,
nt&&h('label',{class:'fl'},'Notes',nt),nb,nm);}
boot();
</script></body></html>
