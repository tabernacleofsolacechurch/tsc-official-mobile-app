<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>TSC Official</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="tsc-icon-192.png">
<style>
:root{--navy:#1B2A4A;--navy2:#24365c;--gold:#D4AF37;--ala:#F7F9FA}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:var(--ala);font:16px/1.6 system-ui,sans-serif;padding-bottom:76px}
header{padding:18px 16px 8px;text-align:center}
header h1{color:var(--gold);font-size:20px}
header p{font-size:12px;opacity:.75}
main{padding:12px 16px;max-width:640px;margin:auto}
.card{background:var(--navy2);border:1px solid #3a4d78;border-radius:14px;padding:16px;margin-bottom:14px}
.card h2,.card h3{color:var(--gold);margin-bottom:6px}
.muted{opacity:.75;font-size:14px}
.btn{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;border:0;border-radius:10px;padding:10px 16px;margin:6px 8px 0 0;text-decoration:none;font-size:15px}
.btn.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
img.ban{width:100%;border-radius:10px;margin-bottom:10px}
audio{width:100%;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12203b;border-top:1px solid #3a4d78;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--ala);opacity:.65;padding:14px 2px;font-size:12px}
nav button.on{color:var(--gold);opacity:1;font-weight:700}
.q{border-left:3px solid var(--gold);padding-left:12px;font-style:italic;margin:10px 0}
.fl{display:block;margin:12px 0 4px;font-size:14px}
.in{width:100%;padding:12px;border-radius:10px;border:1px solid #3a4d78;background:#12203b;color:var(--ala);font:inherit}
.ck{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px}
.ck input{margin-top:6px}
.err{color:#ff9a9a;margin:10px 0}
</style></head>
<body>
<header><img src="tsc-logo.png" alt="Tabernacle of Solace Church" style="height:92px;background:#fff;padding:6px;border-radius:14px"></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var SB='https://kniksxocjsuqghydipmg.supabase.co/rest/v1/';
var KEY='sb_publishable_d_CZpD5xT8TPeg10c07Jog_QoqJ_qan';
var WA='https://wa.me/2348147560000';
var RADIO='https://tabernacleofsolacechurch.github.io/radio.html';
var app=document.getElementById('app');
function api(p){return fetch(SB+p,{headers:{apikey:KEY}}).then(function(r){if(!r.ok)throw new Error('Could not load ('+r.status+')');return r.json();});}
function h(t,a){var e=document.createElement(t);a=a||{};for(var k in a){if(k==='class')e.className=a[k];else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}
for(var i=2;i<arguments.length;i++){[].concat(arguments[i]).forEach(function(c){if(c==null||c===false||c==='')return;e.append(c.nodeType?c:document.createTextNode(String(c)));});}return e;}
function safe(u){return /^https?:\/\//i.test(u||'')?u:'';}
function dt(d,time){if(!d)return '';var o={weekday:'short',day:'numeric',month:'short',year:'numeric'};if(time){o.hour='numeric';o.minute='2-digit';}return new Date(d).toLocaleString('en-GB',o);}
function paras(t){return String(t||'').split(/\n+/).map(function(x){return x.trim()?h('p',{},x):null;});}
function list(v){return Array.isArray(v)?v.join(', '):(v||'');}
function say(t){app.replaceChildren(h('p',{class:'muted'},t));}
function fail(e,retry){app.replaceChildren(h('div',{class:'card'},h('p',{},'Sorry, this could not load. Check your internet and try again.'),h('p',{class:'muted'},e.message),h('button',{class:'btn',onclick:retry},'Try again')));}
function sec(t,x){return x?h('div',{},h('h3',{},t),paras(x)):null;}
function home(){say('Loading...');
var now=new Date(Date.now()-864e5).toISOString();
Promise.all([api('devotionals?select=*&order=publish_date.desc&limit=1'),api('programmes?select=*&start_at=gte.'+now+'&order=start_at.asc&limit=1')]).then(function(r){
var d=r[0][0],p=r[1][0];
var parts=[
h('div',{class:'card'},h('h2',{},'Welcome'),h('p',{},'A tabernacle of solace for the nations, where the broken find comfort, the bound find freedom and the weary find rest.')),
d&&h('div',{class:'card'},h('h3',{},'Latest devotional'),h('p',{},d.title),h('p',{class:'muted'},dt(d.publish_date)),h('button',{class:'btn',onclick:function(){go('devo/'+d.id);}},'Read now')),
p&&h('div',{class:'card'},h('h3',{},'Next programme'),h('p',{},p.title),h('p',{class:'muted'},dt(p.start_at,1)),h('button',{class:'btn',onclick:function(){go('prog');}},'See programmes')),
h('div',{class:'card'},h('a',{class:'btn',href:RADIO,target:'_blank',rel:'noopener'},'Listen to TSC Radio'),h('a',{class:'btn alt',href:WA,target:'_blank',rel:'noopener'},'WhatsApp us'))
].filter(Boolean);
app.replaceChildren.apply(app,parts);}).catch(function(e){fail(e,home);});}
function devoList(){say('Loading...');api('devotionals?select=id,title,publish_date,scripture_ref,category&order=publish_date.desc&limit=60').then(function(rows){
if(!rows.length)return say('No devotionals yet.');
app.replaceChildren.apply(app,rows.map(function(d){return h('div',{class:'card',onclick:function(){go('devo/'+d.id);}},h('h3',{},d.title),h('p',{class:'muted'},dt(d.publish_date)+(d.scripture_ref?' · '+d.scripture_ref:'')));}));
}).catch(function(e){fail(e,devoList);});}
function devoOne(id){say('Loading...');api('devotionals?select=*&id=eq.'+encodeURIComponent(id)).then(function(r){var d=r[0];if(!d)return say('Not found.');
app.replaceChildren(h('button',{class:'btn alt',onclick:function(){go('devo');}},'Back'),h('div',{class:'card'},h('h2',{},d.title),h('p',{class:'muted'},dt(d.publish_date)),
d.scripture_ref&&h('p',{class:'q'},d.scripture_ref+(d.scripture_text?': '+d.scripture_text:'')),
sec('Message',d.message),sec('Application',d.application),sec('Reflection',d.reflection),sec('Prayer',d.prayer),d.related_reading&&h('p',{class:'muted'},'Related reading: '+d.related_reading)));
}).catch(function(e){fail(e,function(){devoOne(id);});});}
function prog(){say('Loading...');api('programmes?select=*&order=start_at.asc&limit=40').then(function(rows){
var now=Date.now()-864e5;var up=rows.filter(function(p){return new Date(p.start_at)>=now;});
if(!up.length)return say('No upcoming programmes right now. Please check back soon.');
app.replaceChildren.apply(app,up.map(function(p){return h('div',{class:'card'},
safe(p.banner_url)&&h('img',{class:'ban',src:safe(p.banner_url),alt:'',loading:'lazy'}),
h('h3',{},p.title),h('p',{class:'muted'},dt(p.start_at,1)+(p.end_at?' to '+dt(p.end_at,1):'')),
(p.venue_name||p.venue_address)&&h('p',{},[p.venue_name,p.venue_address].filter(Boolean).join(', ')),
paras(p.description),
h('p',{class:'muted'},p.is_paid?(p.price_text||'Paid'):'Free'),
p.contact_info&&h('p',{class:'muted'},p.contact_info),
safe(p.map_url)&&h('a',{class:'btn alt',href:safe(p.map_url),target:'_blank',rel:'noopener'},'Map'));}));
}).catch(function(e){fail(e,prog);});}
function serm(){say('Loading...');api('sermons?select=id,title,speaker,preached_on,description,scripture_refs,category,video_url,audio_url&order=preached_on.desc&limit=50').then(function(rows){
if(!rows.length)return say('No sermons yet.');
app.replaceChildren.apply(app,rows.map(function(s){return h('div',{class:'card'},h('h3',{},s.title),
h('p',{class:'muted'},[s.speaker,dt(s.preached_on),list(s.scripture_refs)].filter(Boolean).join(' · ')),
paras(s.description),
safe(s.audio_url)&&h('audio',{controls:'',preload:'none',src:safe(s.audio_url)}),
safe(s.video_url)&&h('a',{class:'btn',href:safe(s.video_url),target:'_blank',rel:'noopener'},'Watch video'));}));
}).catch(function(e){fail(e,serm);});}
function about(){
app.replaceChildren(
h('div',{class:'card'},h('h2',{},'About TSC'),h('p',{},'Tabernacle of Solace Church is led by Apostle Oluwaseun Israel, Founder and Senior Pastor.')),
h('div',{class:'card'},h('h3',{},'Our vision'),h('p',{},'A tabernacle of solace for the nations, where the broken find comfort, the bound find freedom and the weary find rest.')),
h('div',{class:'card'},h('h3',{},'Our mission'),h('p',{},'To restore broken souls and renew faith in Jesus Christ through the preaching of the Word, prophetic ministry, deliverance and loving discipleship.')),
h('div',{class:'card'},h('h3',{},'Meetings'),h('p',{},'Morning Altar: live daily at 5:30am on TSC Radio.'),h('p',{},'Mercy Encounter: every second Sunday of the month at 3pm, Dominion hall, No 76 MKO Abiola Way, behind Henrytee Motors, Ring Road, Ibadan.'),h('a',{class:'btn',href:RADIO,target:'_blank',rel:'noopener'},'TSC Radio')),
h('div',{class:'card'},h('h3',{},'Contact'),h('p',{},'tabernacleofsolacechurch@gmail.com'),h('a',{class:'btn',href:WA,target:'_blank',rel:'noopener'},'WhatsApp us'),h('a',{class:'btn alt',href:'https://tabernacleofsolacechurch.github.io/',target:'_blank',rel:'noopener'},'Church website'))
);}
function v(id){return document.getElementById(id).value.trim();}
function ck(id){return document.getElementById(id).checked;}
function picked(n){return [].map.call(document.querySelectorAll('input[name="'+n+'"]:checked'),function(x){return x.value;});}
function fld(l,e){return h('label',{class:'fl'},l,e);}
function inp(id,type,ph){return h('input',{id:id,type:type||'text',placeholder:ph||'',class:'in'});}
function sel(id,o){return h('select',{id:id,class:'in'},o.map(function(x){return h('option',{value:x},x);}));}
function txa(id,ph){return h('textarea',{id:id,rows:'4',placeholder:ph||'',class:'in'});}
function boxes(n,o){return h('div',{},o.map(function(x){return h('label',{class:'ck'},h('input',{type:'checkbox',name:n,value:x}),x);}));}
function one(id,t){return h('label',{class:'ck'},h('input',{type:'checkbox',id:id}),t);}
function post(table,body){return fetch(SB+table,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)}).then(function(r){if(r.ok)return;return r.text().then(function(t){var m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);});});}
function send(table,body,arr){return post(table,body).catch(function(e){if(!arr||!/array|malformed|invalid input/i.test(e.message))throw e;var b2={};for(var k in body)b2[k]=(arr.indexOf(k)>-1&&Array.isArray(body[k]))?body[k].join(', '):body[k];return post(table,b2);});}
function formPage(title,intro,fields,build,table,arr,thanks){
var msg=h('p',{class:'err'});
var hp=h('input',{tabindex:'-1',autocomplete:'off',style:'position:absolute;left:-9999px'});
var btn=h('button',{class:'btn',type:'button'},'Submit');
function done(){app.replaceChildren(h('div',{class:'card'},h('h2',{},'Thank you'),h('p',{},thanks),h('button',{class:'btn',onclick:function(){go('conn');}},'Back')));}
btn.addEventListener('click',function(){
msg.textContent='';
var r=build();
if(r.error){msg.textContent=r.error;return;}
if(hp.value){done();return;}
btn.disabled=true;btn.textContent='Sending...';
send(table,r.body,arr).then(done).catch(function(e){btn.disabled=false;btn.textContent='Submit';msg.textContent='Could not send: '+e.message;});
});
app.replaceChildren(h('button',{class:'btn alt',onclick:function(){go('conn');}},'Back'),h('div',{class:'card'},h('h2',{},title),h('p',{class:'muted'},intro),fields,hp,msg,btn));
}
function conn(){
function c(t,d,r){return h('div',{class:'card',onclick:function(){go(r);}},h('h3',{},t),h('p',{class:'muted'},d));}
app.replaceChildren(h('div',{class:'card'},h('h2',{},'Connect with TSC'),h('p',{class:'muted'},'We would love to hear from you.')),
c('Send a prayer request','Share your need with our prayer team.','pray'),
c('Become a member','Join the TSC family.','join'),
c('I am new here','New believer or first-time guest? Let us walk with you.','nb'),
c('About TSC','Our vision, mission and meetings.','about'));}
function fPray(){
formPage('Prayer request','Share your need and our prayer team will stand with you. Prayer from TSC is free.',
[fld('Your name',inp('pn','text','Name or Anonymous')),
fld('How should we reach you?',sel('pcm',['WhatsApp','Phone call','Email','No contact needed'])),
fld('Phone number or email (optional)',inp('pcd','text','')),
fld('Your prayer request',txa('prq','Write your request here')),
one('pmc','You may contact me about this request'),
one('pcn','I agree that TSC may keep and use this request to pray and follow up with me.')],
function(){
var q=v('prq');
if(q.length<3)return{error:'Please write your prayer request.'};
if(q.length>5000)return{error:'Your request is too long (maximum 5000 characters).'};
if(!ck('pcn'))return{error:'Please tick the consent box to continue.'};
return{body:{name:v('pn')||'Anonymous',contact_method:v('pcm'),contact_detail:v('pcd')||null,request:q,may_contact:ck('pmc'),consent:true,status:'new'}};
},'prayer_requests',null,'Your prayer request has been received. We are standing with you.');}
function fJoin(){
var dep=h('div',{});
formPage('Become a member','Join the TSC family. Our team will contact you.',
[fld('Full name',inp('jfn','text','')),
fld('Phone number',inp('jph','tel','')),
fld('Email (optional)',inp('jem','email','')),
fld('Area or address (optional)',inp('jar','text','')),
fld('Preferred contact',sel('jpc',['WhatsApp','Phone call','SMS','Email'])),
fld('Where are you in your faith journey?',sel('jfs',['Born again','New believer','Exploring faith','Returning to faith'])),
dep,
fld('Message (optional)',txa('jms','Anything you would like us to know')),
one('jcn','I agree that TSC may keep and use my details to contact me and keep church records.')],
function(){
var f=v('jfn'),p=v('jph'),e=v('jem'),m=v('jms'),d=picked('jdp');
if(f.length<2||f.length>120)return{error:'Please enter your full name.'};
if(p.length<7||p.length>20)return{error:'Please enter a valid phone number.'};
if(e&&!/^\S+@\S+\.\S+$/.test(e))return{error:'Please check your email address.'};
if(m.length>3000)return{error:'Your message is too long.'};
if(!ck('jcn'))return{error:'Please tick the consent box to continue.'};
return{body:{full_name:f,phone:p,email:e||null,area:v('jar')||null,preferred_contact:v('jpc'),faith_status:v('jfs'),interest_departments:d.length?d:null,message:m||null,consent:true,status:'new_registration'}};
},'members',['interest_departments'],'Welcome to the family! A member of our team will contact you soon.');
api('departments?select=*').then(function(rows){
var n=rows.map(function(r){return r.name||r.title||r.department_name;}).filter(Boolean);
if(n.length)dep.append(h('p',{class:'fl'},'Departments you are interested in (optional)'),boxes('jdp',n));
}).catch(function(){});}
function fNew(){
formPage('I am new here','Whether you just gave your life to Christ or you are exploring, we would love to walk with you.',
[fld('Full name',inp('nfn','text','')),
fld('Phone number',inp('nph','tel','')),
fld('Email (optional)',inp('nem','email','')),
fld('Preferred contact',sel('npc',['WhatsApp','Phone call','SMS','Email'])),
h('p',{class:'fl'},'How can we help you?'),
boxes('nrt',['I gave my life to Christ','I recommitted my life to Christ','I want to know more about Jesus','Please call me','I need prayer','Water baptism information']),
fld('Message (optional)',txa('nms','')),
one('ncn','I agree that TSC may keep and use my details to follow up with me.')],
function(){
var f=v('nfn'),p=v('nph'),e=v('nem'),m=v('nms'),r=picked('nrt');
if(f.length<2||f.length>120)return{error:'Please enter your full name.'};
if(p.length<7||p.length>20)return{error:'Please enter a valid phone number.'};
if(e&&!/^\S+@\S+\.\S+$/.test(e))return{error:'Please check your email address.'};
if(!r.length)return{error:'Please choose at least one option.'};
if(m.length>3000)return{error:'Your message is too long.'};
if(!ck('ncn'))return{error:'Please tick the consent box to continue.'};
return{body:{full_name:f,phone:p,email:e||null,preferred_contact:v('npc'),request_types:r,message:m||null,consent:true,status:'new'}};
},'new_believer_requests',['request_types'],'Thank you! A member of our team will reach out to you soon.');}
var tabs=[['home','Home'],['devo','Devotional'],['prog','Programmes'],['serm','Sermons'],['conn','Connect']];
var nav=document.getElementById('nav');
tabs.forEach(function(t){nav.append(h('button',{id:'t-'+t[0],onclick:function(){go(t[0]);}},t[1]));});
function go(r){location.hash='#'+r;}
function route(){var p=(location.hash||'#home').slice(1).split('/');var r=p[0];
var hl=['about','pray','join','nb'].indexOf(r)>-1?'conn':r;tabs.forEach(function(t){document.getElementById('t-'+t[0]).className=t[0]===hl?'on':'';});
window.scrollTo(0,0);
if(r==='devo'&&p[1])devoOne(p[1]);else if(r==='devo')devoList();else if(r==='prog')prog();else if(r==='serm')serm();else if(r==='about')about();else if(r==='conn')conn();else if(r==='pray')fPray();else if(r==='join')fJoin();else if(r==='nb')fNew();else home();}
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
